; BIOBUZZ 3D — Epic Online Services credentials for internet play.
;
; Copy this file to  eos_credentials.cfg  (same folder as project.godot), fill
; in the values from the Epic Developer Portal (see ONLINE.md, "Set up Epic
; Online Services"), then export the game. Every copy you hand out carries
; these values; that is normal for an EOS game client. Give the client policy
; only the permissions ONLINE.md lists.
;
; To test without re-exporting, the same file can instead be placed in the
; game's user folder (Windows: %APPDATA%\Godot\app_userdata\BIOBUZZ 3D\).

[eos]
product_name="BioBuzz3D"
product_id=""
sandbox_id=""
deployment_id=""
client_id=""
client_secret=""
; optional: 64 hex characters, only used by EOS storage features
encryption_key=""
